<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ATT&CK Rule-Based Navigator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">AT</span>
        <span>MITRE ATT&amp;CK Rule-Based Navigator</span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}">Analyse</a>
        <a href="{{ url_for('rules_page') }}">Knowledge base</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
